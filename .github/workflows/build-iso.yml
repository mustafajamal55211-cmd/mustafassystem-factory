name: Build MustafasSystem ISO
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Speicherplatz freigeben
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          docker image prune -af
      - name: Echte ISO in Debian (trixie) bauen
        run: |
          docker run --rm --privileged -v "$PWD:/work" -w /work debian:trixie bash -e -c '
            export DEBIAN_FRONTEND=noninteractive
            sed -i "s/Components: main/Components: main contrib non-free non-free-firmware/g" /etc/apt/sources.list.d/debian.sources
            apt-get update
            apt-get install -y live-build squashfs-tools xorriso isolinux syslinux-common dosfstools mtools python3-pil

            rm -rf config auto .build binary chroot cache
            BP_FLAG=""
            [ "trixie" = "trixie" ] && BP_FLAG="--backports true"
            lb config --distribution trixie $BP_FLAG --architectures amd64 --linux-flavours amd64 --binary-images iso-hybrid --archive-areas "main contrib non-free non-free-firmware" --bootappend-live "boot=live components locales=de_DE.UTF-8 keyboard-layouts=de quiet splash"

            if [ -f theme/prepare_theme.py ]; then
              python3 theme/prepare_theme.py
            fi

            mkdir -p config/package-lists
            printf "%s\n" live-boot live-config live-config-systemd systemd-sysv sudo locales console-setup keyboard-configuration network-manager network-manager-gnome wpasupplicant wireless-tools iw rfkill firmware-linux firmware-linux-free firmware-linux-nonfree firmware-misc-nonfree firmware-iwlwifi firmware-realtek firmware-atheros firmware-brcm80211 firmware-mediatek firmware-libertas firmware-amd-graphics firmware-sof-signed bluez bluez-firmware blueman pipewire-audio pavucontrol alsa-utils udisks2 gvfs gvfs-backends gvfs-fuse thunar-volman eject dosfstools exfatprogs ntfs-3g xorg xserver-xorg-video-all libgl1-mesa-dri mesa-utils va-driver-all vlc xfce4-terminal xfce4-screenshooter thunar mousepad firefox-esr arc-theme papirus-icon-theme zram-tools python3 python3-gi python3-gi-cairo python3-cairo gir1.2-gtk-3.0 gir1.2-gdkpixbuf-2.0 cage weston > config/package-lists/custom.list.chroot

            for listf in theme/desktop_packages.txt packages.txt; do
              [ -f "$listf" ] || continue
              while IFS= read -r pkg || [ -n "$pkg" ]; do
                pkg=$(echo "$pkg" | tr -d "\r" | xargs)
                [ -z "$pkg" ] && continue
                case "$pkg" in pulseaudio|pulseaudio-module-bluetooth) continue ;; esac
                apt-cache show "$pkg" >/dev/null 2>&1 && echo "$pkg" >> config/package-lists/custom.list.chroot || true
              done < "$listf"
            done

            lb build
          '
      - name: ISO als Release hochladen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISO_FILE=$(ls -1 live-image-*.iso | head -n1)
          mv "$ISO_FILE" "mustafassystem.iso"
          TAG="build-${{ github.run_number }}"
          SIZE=$(stat -c%s "mustafassystem.iso")
          if [ "$SIZE" -gt 2000000000 ]; then
            split -b 1800M -d "mustafassystem.iso" "mustafassystem.iso.part-"
            gh release create "$TAG" mustafassystem.iso.part-* --title "MustafasSystem ($TAG)" --notes "Gebaut mit Mustafa Factory (inkl. Waydroid + Google Play)!"
          else
            gh release create "$TAG" "mustafassystem.iso" --title "MustafasSystem ($TAG)" --notes "Gebaut mit Mustafa Factory (inkl. Waydroid + Google Play)!"
          fi
